name: PFL reel - lecture seule
on:
  workflow_dispatch:
  push:
    branches: [fix/pfl-publication-pipeline]
    paths:
      - '.github/workflows/pfl-live-readonly.yml'
permissions:
  contents: read
concurrency:
  group: pfl-live-readonly
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/fix/pfl-publication-pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Identifier le diagnostic
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF"
          echo 'Decouverte: vingt fiches maximum; rapprochement: cinq evenements maximum; aucune publication.'
      - name: Installer les dependances
        run: |
          python -m pip install supabase
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Decouvrir les fiches PFL par navigateur sans secrets Supabase
        run: node collector/pfl_browser_discovery.cjs --output reports/pfl-live-browser.json --limit 20
      - name: Normaliser la decouverte sans sauvegarde
        id: discovery
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/pfl_daily_discovery.py --browser-report reports/pfl-live-browser.json --output reports/pfl-live-discovery.json --limit 20
      - name: Rapprocher cinq evenements reels sans sauvegarde
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/pfl_reconciliation.py --limit 5 --discovery reports/pfl-live-discovery.json --output reports/pfl-live-readonly.json
      - name: Verifier et resumer le rapport reel
        env:
          DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          discovery = json.loads(Path('reports/pfl-live-discovery.json').read_text())
          report = json.loads(Path('reports/pfl-live-readonly.json').read_text())
          if discovery.get('mode') != 'pfl_browser_discovery_report' or report.get('mode') != 'pfl_reconciliation_report':
              raise SystemExit('Format de rapport inattendu')
          if discovery.get('database_writes') is not False or discovery.get('automatic_publication') is not False or report.get('automatic_publication') is not False or 'saved' in report:
              raise SystemExit('Contrat de lecture seule non respecte')
          observations = report.get('reports', [])
          eligible = sum(item.get('source_validation', {}).get('can_reconcile') is True for item in observations)
          summary = {
              'commit': os.environ['GITHUB_SHA'],
              'discovery_outcome': os.environ['DISCOVERY_OUTCOME'],
              'discovery_summary': discovery.get('summary', {}),
              'events_observed': report.get('events_observed', 0),
              'fights_observed': report.get('fights_observed', 0),
              'sources_reconcilable': eligible,
              'errors': len(report.get('errors', [])),
              'proposals': report.get('summary', {}),
              'report_saved_to_database': False,
          }
          text = json.dumps(summary, ensure_ascii=False, indent=2)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('## Diagnostic navigateur PFL sans publication\n\n```json\n' + text + '\n```\n')
          for candidate in discovery.get('candidates', []):
              print(json.dumps({'source_url': candidate.get('source_url'), 'metadata': candidate.get('metadata'), 'extraction_status': candidate.get('extraction_status'), 'row_count': candidate.get('row_count'), 'card_html_present': bool(candidate.get('card_html'))}, ensure_ascii=False))
          for item in observations:
              print(json.dumps({'event_id': item.get('event_id'), 'source_url': item.get('source_url'), 'source_validation': item.get('source_validation'), 'fight_count': len(item.get('observed_fights', []))}, ensure_ascii=False))
          if os.environ['DISCOVERY_OUTCOME'] != 'success' or discovery.get('errors') or report.get('errors') or not observations:
              raise SystemExit('Diagnostic incomplet : consulter les rapports JSON')
          if not eligible:
              raise SystemExit('Aucune source exploitable pour le rapprochement : consulter les rapports JSON')
          PY
      - name: Conserver les rapports meme en cas de blocage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pfl-live-readonly
          path: |
            reports/pfl-live-browser.json
            reports/pfl-live-discovery.json
            reports/pfl-live-readonly.json
          if-no-files-found: warn
          retention-days: 7
