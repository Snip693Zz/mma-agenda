name: PFL reel - lecture seule
on:
  workflow_dispatch:
  push:
    branches: [fix/pfl-publication-pipeline]
    paths:
      - '.github/workflows/pfl-live-readonly.yml'
permissions:
  contents: read
concurrency:
  group: pfl-live-readonly
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/fix/pfl-publication-pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identifier le diagnostic
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF"
          echo 'Limite: cinq evenements PFL; aucun --apply, --publish ou --sync.'
      - name: Installer le client Supabase
        run: python -m pip install supabase
      - name: Rapprocher cinq evenements reels sans sauvegarde
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/pfl_reconciliation.py --limit 5 --output reports/pfl-live-readonly.json
      - name: Verifier et resumer le rapport reel
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('reports/pfl-live-readonly.json').read_text())
          if report.get('mode') != 'pfl_reconciliation_report':
              raise SystemExit('Format de rapport inattendu')
          if report.get('automatic_publication') is not False or 'saved' in report:
              raise SystemExit('Contrat de lecture seule non respecte')
          observations = report.get('reports', [])
          eligible = sum(item.get('source_validation', {}).get('can_reconcile') is True for item in observations)
          summary = {
              'commit': os.environ['GITHUB_SHA'],
              'events_observed': report.get('events_observed', 0),
              'fights_observed': report.get('fights_observed', 0),
              'sources_reconcilable': eligible,
              'errors': len(report.get('errors', [])),
              'proposals': report.get('summary', {}),
              'report_saved_to_database': False,
          }
          text = json.dumps(summary, ensure_ascii=False, indent=2)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('## Diagnostic PFL reel sans publication\n\n```json\n' + text + '\n```\n')
          for item in observations:
              print(json.dumps({'event_id': item.get('event_id'), 'source_validation': item.get('source_validation'), 'fight_count': len(item.get('observed_fights', []))}, ensure_ascii=False))
          if report.get('errors') or not observations:
              raise SystemExit('Diagnostic incomplet : consulter le rapport JSON')
          if not eligible:
              raise SystemExit('Aucune source exploitable pour le rapprochement : consulter le rapport JSON')
          PY
      - name: Conserver le rapport meme en cas de blocage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pfl-live-readonly
          path: reports/pfl-live-readonly.json
          if-no-files-found: warn
          retention-days: 7
