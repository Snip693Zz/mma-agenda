name: Tests PFL isoles sans secrets
on:
  push:
    branches: [fix/pfl-safe-extraction]
    paths:
      - 'collector/**'
      - '.github/workflows/pfl-safety-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'collector/**'
      - '.github/workflows/pfl-safety-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest supabase
      - name: Executer les tests sans secrets de production
        working-directory: collector
        run: python -m pytest -q --junitxml=../reports/pfl-safety-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pfl-safety-tests
          path: reports/pfl-safety-tests.xml
          if-no-files-found: warn
