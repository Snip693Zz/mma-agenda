name: Extraire les cartes UFC - rapport sans écriture
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collector/ufc_cards.py', 'collector/test_ufc_cards.py', '.github/workflows/ufc-cards.yml']
permissions:
  contents: read
jobs:
  ufc-cards:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester les extracteurs
        run: python -m unittest discover -s collector -p 'test_*.py' -v
      - name: Lire les cartes UFC sans modifier les données
        run: python collector/ufc_cards.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-cartes-ufc
          path: reports/ufc-cards.json
          if-no-files-found: warn
          retention-days: 14
