name: Synchroniser le fichier de secours
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install supabase
      - name: Exporter Supabase vers le fichier de secours
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/export_fallback.py
      - name: Commit si le fichier a changé
        run: |
          if git diff --quiet mma-data.json; then
            echo 'Aucun changement : aucun commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add mma-data.json
            git commit -m 'chore: synchroniser le fichier de secours depuis Supabase'
            git push
          fi
      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-synchronisation-secours
          path: reports/fallback-refresh.json
          if-no-files-found: warn
          retention-days: 30
