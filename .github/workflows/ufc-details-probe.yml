name: Diagnostic des détails UFC - sans publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - collector/ufc_details_probe.py
      - collector/test_ufc_details_probe.py
      - .github/workflows/ufc-details-probe.yml
permissions:
  contents: read
concurrency:
  group: ufc-details-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester les protections du diagnostic
        run: python -m unittest discover -s collector -p 'test_ufc_details_probe.py' -v
      - name: Vérifier la compatibilité avec les tests UFC existants
        run: |
          python -m unittest discover -s collector -p 'test_ufc_cards.py' -v
          python -m unittest discover -s collector -p 'test_ufc_cards_review.py' -v
          python -m unittest discover -s collector -p 'test_ufc_proposals.py' -v
      - name: Capturer la page officielle sans écriture dans l’agenda
        run: python collector/ufc_details_probe.py
      - name: Conserver les preuves et le diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-details-ufc
          path: reports/ufc-details-probe/
          if-no-files-found: warn
          retention-days: 14
  save_diagnostic:
    needs: diagnostic
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-details-ufc
          path: ${{ runner.temp }}/ufc-diagnostic
      - uses: actions/checkout@v4
        with:
          ref: main
          path: diagnostic-store
      - name: Ouvrir la branche de diagnostic isolée
        working-directory: diagnostic-store
        shell: bash
        run: |
          set -euo pipefail
          remote_ref="$(git ls-remote --heads origin refs/heads/diagnostics/ufc-details)"
          if [ -n "$remote_ref" ]; then
            git fetch origin refs/heads/diagnostics/ufc-details
            git checkout -B diagnostics/ufc-details FETCH_HEAD
          else
            git checkout --orphan diagnostics/ufc-details
            git rm -rf .
          fi
      - name: Vérifier et copier les preuves sans les exécuter
        working-directory: diagnostic-store
        env:
          DIAGNOSTIC_INPUT: ${{ runner.temp }}/ufc-diagnostic
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path(os.environ['DIAGNOSTIC_INPUT'])
          for name in ('report.json', 'source.html'):
              path = source / name
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 10000000:
                  raise ValueError('Fichier de diagnostic invalide')
          raw_report = (source / 'report.json').read_bytes()
          report = json.loads(raw_report)
          html = (source / 'source.html').read_bytes()
          digest = hashlib.sha256(html).hexdigest()
          if report.get('source_sha256') != digest or report.get('status') != 'captured' or report.get('mode') != 'diagnostic_only' or report.get('database_writes') is not False or report.get('automatic_publication') is not False:
              raise ValueError('Diagnostic incomplet ou empreinte invalide')
          target = Path('latest')
          target.mkdir(exist_ok=True)
          (target / 'report.json').write_bytes(raw_report)
          (target / 'source.html.txt').write_bytes(html)
          manifest = {'source_commit': os.environ['SOURCE_COMMIT'], 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'], 'source_url': report['source_url'], 'collected_at': report['collected_at'], 'source_sha256': digest, 'report_sha256': hashlib.sha256(raw_report).hexdigest()}
          (target / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('README.md').write_text('Diagnostic UFC temporaire. Aucun fichier de cette branche ne doit être fusionné dans main. Le HTML est conservé comme texte non fiable, jamais exécuté. latest contient la dernière capture validée ; le ZIP reste disponible dans GitHub Actions.\n', encoding='utf-8')
          PY
      - name: Enregistrer uniquement dans la branche de diagnostic
        working-directory: diagnostic-store
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md latest/report.json latest/source.html.txt latest/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: actualiser le diagnostic UFC'
            git push origin HEAD:refs/heads/diagnostics/ufc-details
          fi
