name: Rafraîchissement UFC — écriture contrôlée
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install supabase
      - name: Collecte et propositions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/daily_refresh_readonly.py
      - name: Journaliser le rapport
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/journal_ufc_report.py
      - name: Contrôler le publieur
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/publisher_control.py
      - name: Publier les propositions éligibles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/publisher_run.py
      - name: Conserver les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rafraichissement-ufc-ecriture-controlee
          path: |
            reports/daily-refresh.json
            reports/journal-receipt.json
            reports/publisher-control.json
            reports/publication-result.json
          if-no-files-found: warn
          retention-days: 30
