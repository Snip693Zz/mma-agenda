name: Rafraîchir les cartes UFC - rapport uniquement
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - collector/daily_refresh_readonly.py
      - collector/test_daily_refresh_readonly.py
      - .github/workflows/daily-refresh.yml
permissions:
  contents: read
concurrency:
  group: daily-ufc-readonly
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester la lecture Supabase et l’absence de publication
        run: python -m unittest discover -s collector -p 'test_daily_refresh_readonly.py' -v
      - run: pip install supabase
      - name: Relire et comparer sans publication
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/daily_refresh_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rafraichissement-ufc
          path: reports/daily-refresh.json
          if-no-files-found: warn
          retention-days: 14
