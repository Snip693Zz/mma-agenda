name: Rafraîchir et publier les ajouts UFC sûrs
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install supabase
      - name: Relire, comparer et publier uniquement les ajouts sûrs
        run: python collector/daily_refresh.py --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rafraichissement-ufc
          path: reports/daily-refresh.json
          retention-days: 14
