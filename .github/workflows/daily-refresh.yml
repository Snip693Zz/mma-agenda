name: Rafraîchir les cartes UFC - rapport et journal
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - collector/daily_refresh_readonly.py
      - collector/test_daily_refresh_readonly.py
      - collector/journal_ufc_report.py
      - collector/test_journal_ufc_report.py
      - collector/publisher_control.py
      - collector/test_publisher_control.py
      - collector/publisher_run.py
      - collector/test_publisher_run.py
      - collector/fallback_sync.py
      - collector/test_fallback_sync.py
      - .github/workflows/daily-refresh.yml
permissions:
  contents: read
concurrency:
  group: daily-ufc-readonly
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester la collecte, le journal, le publieur et la synchronisation
        run: |
          python -m unittest discover -s collector -p 'test_daily_refresh_readonly.py' -v
          python -m unittest discover -s collector -p 'test_journal_ufc_report.py' -v
          python -m unittest discover -s collector -p 'test_publisher_control.py' -v
          python -m unittest discover -s collector -p 'test_publisher_run.py' -v
          python -m unittest discover -s collector -p 'test_fallback_sync.py' -v
      - run: pip install supabase
      - name: Relire et comparer sans publication
        id: collect
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/daily_refresh_readonly.py
      - name: Journaliser sans publication dans l’agenda
        id: journal
        if: ${{ always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/journal_ufc_report.py
      - name: Vérifier le raccordement et la désactivation du publieur
        if: ${{ success() && steps.collect.outcome == 'success' && steps.journal.outcome == 'success' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/publisher_control.py
      - name: Exécuter le publieur sur les propositions éligibles
        if: ${{ success() && steps.collect.outcome == 'success' && steps.journal.outcome == 'success' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/publisher_run.py
      - name: Synchroniser les secours après publication
        if: ${{ hashFiles('reports/publication-result.json') != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/fallback_sync.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rafraichissement-ufc
          path: |
            reports/daily-refresh.json
            reports/journal-receipt.json
            reports/publisher-control.json
            reports/publication-result.json
            reports/fallback-sync.json
          if-no-files-found: warn
          retention-days: 14
      - name: Conserver le statut d’échec de la collecte
        if: ${{ always() && steps.collect.outcome == 'failure' }}
        run: exit 1
