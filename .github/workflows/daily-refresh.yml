name: Rafraîchir les cartes UFC - rapport et journal
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - tests/test_ufc_update_proposals.py
      - .github/workflows/daily-refresh.yml
permissions:
  contents: read
concurrency:
  group: daily-ufc-readonly
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install --upgrade pip && pip install supabase pytest
      - name: Tester tous les modules du collecteur et les mises à jour
        env:
          PYTHONPATH: collector
        run: python -m pytest -q collector tests/test_ufc_update_proposals.py
      - name: Relire et comparer sans publication
        id: collect
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/daily_refresh_readonly.py
      - name: Journaliser sans publication dans l’agenda
        id: journal
        if: ${{ always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/journal_ufc_report.py
      - name: Découvrir les événements PFL sans publication
        id: pfl_discovery
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/pfl_daily_discovery.py --output reports/pfl-daily-discovery.json --limit 20
      - name: Appliquer les garde-fous de publication PFL
        id: pfl_guardrails
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -f reports/pfl-daily-discovery.json ]; then
            python collector/pfl_publication_guardrails.py --discovery reports/pfl-daily-discovery.json --baseline reports/pfl-daily-discovery.json --output reports/pfl-publication-guardrails.json
          else
            echo "Rapport de découverte PFL absent : garde-fous ignorés."
          fi
      - name: Rapprocher les cartes PFL sans publication
        id: pfl_reconciliation
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PFL_APPLY: ${{ vars.PFL_APPLY }}
        run: |
          if [ "${PFL_APPLY,,}" = "true" ]; then
            python collector/pfl_reconciliation.py --output reports/pfl-reconciliation.json --apply
          else
            python collector/pfl_reconciliation.py --output reports/pfl-reconciliation.json
          fi
      - name: Publier les propositions PFL éligibles
        id: pfl_publisher
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PFL_PUBLISH: ${{ vars.PFL_PUBLISH }}
        run: |
          if [ "${PFL_PUBLISH,,}" = "true" ]; then
            python collector/pfl_publisher.py --output reports/pfl-publication-result.json --publish
          else
            python collector/pfl_publisher.py --output reports/pfl-publication-result.json
          fi
      - name: Synchroniser les secours PFL après publication
        id: pfl_fallback
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PFL_FALLBACK: ${{ vars.PFL_FALLBACK }}
        run: |
          if [ "${PFL_FALLBACK,,}" = "true" ]; then
            python collector/pfl_fallback_sync.py --output reports/pfl-fallback-sync.json --sync
          else
            python collector/pfl_fallback_sync.py --output reports/pfl-fallback-sync.json
          fi
      - name: Vérifier le raccordement et la désactivation du publieur
        if: ${{ success() && steps.collect.outcome == 'success' && steps.journal.outcome == 'success' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/publisher_control.py
      - name: Exécuter le publieur sur les propositions éligibles
        if: ${{ success() && steps.collect.outcome == 'success' && steps.journal.outcome == 'success' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/publisher_run.py
      - name: Synchroniser les secours après publication
        if: ${{ hashFiles('reports/publication-result.json') != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/fallback_sync.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rafraichissement-ufc
          path: |
            reports/daily-refresh.json
            reports/journal-receipt.json
            reports/publisher-control.json
            reports/publication-result.json
            reports/fallback-sync.json
            reports/pfl-daily-discovery.json
            reports/pfl-publication-guardrails.json
            reports/pfl-reconciliation.json
            reports/pfl-publication-result.json
            reports/pfl-fallback-sync.json
          if-no-files-found: warn
          retention-days: 14
      - name: Conserver le statut d’échec de la collecte
        if: ${{ always() && steps.collect.outcome == 'failure' }}
        run: exit 1
