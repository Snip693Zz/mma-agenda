name: Vérifier les modules Python du collecteur

on:
  workflow_dispatch:
  push:
    branches: [main, fix/pfl-source-validation]
    paths:
      - 'collector/**'
      - '.github/workflows/collector-tests.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances de test
        run: python -m pip install pytest supabase
      - name: Exécuter la suite Python sans secrets de production
        working-directory: collector
        run: |
          set +e
          mkdir -p ../reports
          python -m pytest -q --junitxml=../reports/collector-tests.xml > ../reports/collector-tests.log 2>&1
          status=$?
          printf '%s' "$status" > ../reports/collector-tests.exit
          exit "$status"
      - name: Préparer le rapport de diagnostic
        if: always()
        run: |
          mkdir -p reports
          {
            echo '## Diagnostic tests — non validé'
            echo
            echo "Commit : $GITHUB_SHA"
            echo "Exécution : https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo 'Sortie de test tronquée ; aucune publication ni écriture Supabase.'
            echo
            echo '```text'
            tail -n 120 reports/collector-tests.log 2>/dev/null || true
            echo '```'
            echo
            echo "Code de sortie : $(cat reports/collector-tests.exit 2>/dev/null || echo inconnu)"
          } > reports/test-diagnostic.md
      - name: Publier le diagnostic dans la PR 4
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/test-diagnostic.md';
            if (!fs.existsSync(path)) {
              core.warning('Aucun rapport disponible ; consulter les étapes précédentes.');
              return;
            }
            const pr = await github.rest.pulls.get({...context.repo, pull_number: 4});
            if (pr.data.state !== 'open' || pr.data.head.ref !== 'fix/pfl-source-validation' || pr.data.head.sha !== context.sha) {
              core.warning('PR fermée ou commit dépassé : aucun commentaire ajouté.');
              return;
            }
            const body = fs.readFileSync(path, 'utf8').slice(0, 48000);
            await github.rest.issues.createComment({...context.repo, issue_number: 4, body});
      - name: Conserver les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests-collecteur
          path: |
            reports/collector-tests.xml
            reports/collector-tests.log
          if-no-files-found: warn
          retention-days: 14
