name: Vérifier les modules Python du collecteur
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - '.github/workflows/collector-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances de test
        run: python -m pip install pytest supabase
      - name: Exécuter la suite Python sans secrets de production
        working-directory: collector
        run: python -m pytest -q --junitxml=../reports/collector-tests.xml
      - name: Conserver les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests-collecteur
          path: reports/collector-tests.xml
          if-no-files-found: warn
          retention-days: 14
