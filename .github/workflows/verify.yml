name: Vérifier l'agenda
on:
  push:
    paths: ['index.html', 'app.js', 'mma-data.json', 'tests/**', '.github/workflows/verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: sources
        run: |
          if test -f index.html && test -f app.js && test -f mma-data.json; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Application non déposée : tests non exécutés.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.sources.outputs.ready == 'true'
        with:
          node-version: '22'
      - if: steps.sources.outputs.ready == 'true'
        run: |
          node --check app.js
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
          npx playwright test --config=tests/playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: navigateur-erreurs
          path: test-results/
          if-no-files-found: ignore
