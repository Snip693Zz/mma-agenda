name: Vérifier l'agenda
on:
  push:
    paths: ['**/*.html', '**/*.js', '**/*.css', 'mma-data.json', 'tests/**', '.github/workflows/verify.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les fichiers et la syntaxe
        run: |
          test -s index.html
          test -s app.js
          test -s month-nav.js
          test -s supabase-sync.js
          test -s mma-data.json
          node --check app.js
          node --check month-nav.js
          node --check supabase-sync.js
      - name: Tests navigateur
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
          npx playwright test --config=tests/playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: navigateur-erreurs
          path: test-results/
          if-no-files-found: ignore
