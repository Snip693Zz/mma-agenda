name: Tests du raccordement PFL
on:
  workflow_dispatch:
  push:
    branches: [fix/pfl-publication-pipeline]
    paths:
      - 'collector/**'
      - 'tests/**'
      - '.github/workflows/pfl-pipeline-tests.yml'
  pull_request:
    paths:
      - 'collector/**'
      - 'tests/**'
      - '.github/workflows/pfl-pipeline-tests.yml'
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/collector
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identifier le commit teste
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF"
      - name: Installer les dependances de test
        run: python -m pip install pytest supabase
      - name: Tester la preparation, le chargement et le point entree sans secrets
        working-directory: collector
        run: |
          python -m unittest -v test_pfl_reconciliation_inputs test_pfl_reconciliation_loader test_pfl_reconciliation_entrypoint
      - name: Executer tous les tests unittest du collecteur
        working-directory: collector
        run: python -m unittest discover -v
      - name: Executer la suite pytest du collecteur et les propositions UFC
        run: python -m pytest -q collector tests/test_ufc_update_proposals.py
