name: Capture PFL par événement

on:
  workflow_dispatch:
    inputs:
      event_url:
        description: 'URL de la fiche PFL à capturer'
        required: true
        type: string

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Installer le navigateur
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Capturer la fiche PFL
        env:
          PFL_EVENT_URL: ${{ inputs.event_url }}
        run: node collector/pfl_browser_probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pfl-event-capture
          path: reports/pfl-browser-probe/
          retention-days: 7
          if-no-files-found: warn
