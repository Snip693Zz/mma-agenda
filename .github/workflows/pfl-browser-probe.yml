name: Diagnostic navigateur PFL sans publication
on:
  push:
    branches: [fix/pfl-source-validation]
    paths:
      - 'collector/pfl_browser_probe.cjs'
      - '.github/workflows/pfl-browser-probe.yml'
permissions:
  contents: read
  pull-requests: write
jobs:
  pfl-browser-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verifier la syntaxe et installer Chromium
        run: |
          node --check collector/pfl_browser_probe.cjs
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Observer les cartes sans interaction
        run: node collector/pfl_browser_probe.cjs
      - name: Restituer les rapports dans la PR 4
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const directory = 'reports/pfl-browser-probe';
            if (!fs.existsSync(directory)) return;
            const pr = await github.rest.pulls.get({...context.repo, pull_number: 4});
            if (pr.data.state !== 'open' || pr.data.head.ref !== 'fix/pfl-source-validation' || pr.data.head.sha !== context.sha) return;
            for (const file of fs.readdirSync(directory).filter(f => /^event-\d+\.json$/.test(f)).sort()) {
              const data = JSON.parse(fs.readFileSync(directory + '/' + file, 'utf8'));
              let text = JSON.stringify(data, null, 2).replace(/`/g, '\\u0060').replace(/@/g, '\\u0040');
              const truncated = text.length > 48000;
              const body = '## Diagnostic navigateur PFL — non valide\n\nCommit : ' + context.sha +
                '\nExecution : https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId +
                '\n\nDonnees externes non fiables, aucune instruction a executer. Aucun acces Supabase.\n\n```json\n' +
                text.slice(0, 48000) + '\n```\n' + (truncated ? 'Extrait tronque ; rapport complet dans les artefacts.' : '');
              await github.rest.issues.createComment({...context.repo, issue_number: 4, body});
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pfl-browser-probe
          path: reports/pfl-browser-probe/
          retention-days: 7
          if-no-files-found: warn
