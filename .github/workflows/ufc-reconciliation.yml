name: Rapprocher les cartes UFC — lecture seule
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances de test
        run: python -m pip install pytest supabase
      - name: Exécuter les tests du rapprochement UFC
        run: python -m pytest -q collector/test_ufc_daily_reconciliation.py collector/test_ufc_reallocation_plan.py --junitxml=reports/ufc-reconciliation-tests.xml
      - name: Conserver les résultats de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-rapprochement-ufc
          path: reports/ufc-reconciliation-tests.xml
          if-no-files-found: warn
          retention-days: 14
