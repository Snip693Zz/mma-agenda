name: Rapprocher les cartes UFC — lecture seule
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install pytest supabase beautifulsoup4
      - name: Exécuter les tests du rapprochement UFC
        run: python -m pytest -q collector/test_ufc_daily_reconciliation.py collector/test_ufc_reconciliation_run.py collector/test_ufc_reallocation_plan.py --junitxml=reports/ufc-reconciliation-tests.xml
      - name: Rapprocher les cartes UFC depuis Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/ufc_reconciliation_run.py --output reports/ufc-reconciliation.json
      - name: Conserver le rapport de rapprochement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-rapprochement-ufc
          path: |
            reports/ufc-reconciliation.json
            reports/ufc-reconciliation-tests.xml
          if-no-files-found: warn
          retention-days: 14
