name: Rapport PFL quotidien

on:
  schedule:
    - cron: "0 5 * * *"   # 06 h 00 Paris (05 h 00 UTC)
  workflow_dispatch:

jobs:
  pfl-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Run PFL reconciliation report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python collector/pfl_reconciliation.py --apply

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pfl-reconciliation-report
          path: reports/pfl-reconciliation.json
