name: Fighter records report

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre maximal de combattants PFL à vérifier"
        required: false
        default: "3"
      apply:
        description: "Créer les propositions Supabase après vérification"
        required: false
        default: "false"
        type: boolean

jobs:
  verify-and-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase pytest

      - name: Check required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL est absent."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY est absent."
            exit 1
          fi
          echo "Secrets Supabase présents."

      - name: Run fighter records tests
        working-directory: collector
        run: pytest -q test_fighter_records.py

      - name: Run PFL fighter records report
        working-directory: collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            python fighter_records.py --limit "${{ github.event.inputs.limit }}" --apply --output reports/fighter-records.json
          else
            python fighter_records.py --limit "${{ github.event.inputs.limit }}" --output reports/fighter-records.json
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: fighter-records-report
          path: collector/reports/fighter-records.json
